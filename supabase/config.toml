# Supabase CLI configuration for uptime-monitor.
#
# Checked in so CI/CD (and fresh clones) can run Supabase commands
# non-interactively with no manual `supabase init` / `supabase link` steps.
# Auth comes from the SUPABASE_ACCESS_TOKEN env var (GitHub secret);
# the target project comes from --project-ref "$SUPABASE_PROJECT_REF".
# See .github/workflows/supabase-migrations.yml.

project_id = "uptime-monitor"

# `deno.json` for the edge functions lives in supabase/functions/.

# The dispatch function authenticates with a shared secret from its own
# secret store, so JWT verification is turned off: the gateway check would
# reject every caller because these are server-to-server invocations, not
# user JWTs. The handler does a constant-time compare of
# x-dispatch-secret against NOTIFICATION_DISPATCH_SECRET instead.
[functions.notification-dispatch]
verify_jwt = false
