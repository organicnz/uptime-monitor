# Lefthook Configuration - Enterprise Ready
# Run `npx lefthook install` to set up hooks
#
# Features:
# - Parallel execution for speed
# - Staged files only (incremental checks)
# - Skip options for CI/emergency
# - Conventional commits enforcement
# - Security checks
# - Branch naming conventions

# Global settings
min_version: 1.5.0
colors: false
no_tty: true
output:
  - summary
  - failure

# Pre-commit: Fast checks on staged files only
pre-commit:
  parallel: true
  piped: false

  commands:
    # TypeScript type checking (staged files only)
    typecheck:
      priority: 1
      glob: "*.{ts,tsx}"
      run: bunx tsc --noEmit --skipLibCheck
      fail_text: "❌ TypeScript errors found. Fix type issues before committing."

    # ESLint with auto-fix disabled (check only)
    lint:
      priority: 1
      glob: "*.{js,jsx,ts,tsx}"
      run: bunx eslint {staged_files} --max-warnings 0 --no-fix
      fail_text: "❌ ESLint errors found. Run 'npm run lint -- --fix' to auto-fix."

    # Prettier format check
    format:
      priority: 2
      glob: "*.{js,jsx,ts,tsx,json,css,md,yml,yaml}"
      run: bunx prettier --check {staged_files}
      fail_text: "❌ Formatting issues found. Run 'npx prettier --write .' to fix."

    # Check for debug statements (CI tooling in scripts/ intentionally logs)
    no-debug:
      priority: 3
      glob: "*.{ts,tsx,js,jsx}"
      exclude: "scripts/*"
      run: tools/audit/target/release/audit no-debug {staged_files}
      fail_text: "❌ Debug statements found. Remove console.log, debugger, etc."

    # Check for secrets/credentials
    secrets-check:
      priority: 3
      glob: "*.{ts,tsx,js,jsx,json,env*}"
      run: tools/audit/target/release/audit secrets-check {staged_files}
      fail_text: "❌ Potential secrets detected. Never commit credentials!"

    # Validate JSON files
    json-validate:
      priority: 2
      glob: "*.json"
      exclude: "package-lock.json"
      run: tools/audit/target/release/audit json-validate {staged_files}
      fail_text: "❌ Invalid JSON syntax detected."

    # Check file size (prevent large files)
    file-size:
      priority: 4
      run: tools/audit/target/release/audit file-size {staged_files}
      fail_text: "❌ File too large. Max 500KB for source files."

# Commit message validation
commit-msg:
  commands:
    # Conventional commits format
    conventional:
      run: tools/audit/target/release/audit commit-msg {1}
      fail_text: |
        ❌ Invalid commit message format!

        Use conventional commits: type(scope?): subject

        Types: feat, fix, docs, style, refactor, perf, test, chore, build, ci, revert

        Examples:
          feat: add monitor status badges
          fix(auth): resolve login redirect issue
          docs: update API documentation

    # Commit message length check
    length:
      run: tools/audit/target/release/audit commit-msg-length {1}
      fail_text: "❌ Commit subject too long. Keep under 72 characters."

# Pre-push: Full validation before pushing
pre-push:
  parallel: false
  piped: true

  commands:
    verify-delivery:
      priority: 1
      run: bun run verify:delivery
      timeout: 30m
      fail_text: "❌ Delivery checks failed. Fix all issues before pushing."

    branch-name:
      priority: 0
      run: tools/audit/target/release/audit branch-name
      fail_text: |
        ❌ Invalid branch name!

        Use: type/description or type/TICKET-123-description

        Types: feature, fix, hotfix, release, chore, docs

        Examples:
          feature/add-monitor-groups
          fix/PROJ-123-login-redirect
          hotfix/critical-auth-bug

# Post-checkout: Setup reminders
post-checkout:
  commands:
    deps-reminder:
      run: tools/audit/target/release/audit deps-reminder

# Post-merge: Dependency updates reminder
post-merge:
  commands:
    deps-reminder:
      run: tools/audit/target/release/audit deps-reminder
