name: Supabase Migrations

# Fully automated delivery: no manual SQL Editor pastes, no manual
# `supabase link` / `supabase db push` / dashboard deploys.
#
# - pull_request: validate only (lint + static checks). NEVER writes to prod.
# - push to main / workflow_dispatch: apply migrations, verify live schema,
#   then deploy edge functions.
#
# Required secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF.

on:
  pull_request:
    branches: ["main"]
    paths:
      - "supabase/**"
      - "scripts/supabase-*.py"
      - ".github/workflows/supabase-migrations.yml"
  workflow_run:
    workflows: ["Quality Gate"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

# A migration must never be cancelled or run twice concurrently.
concurrency:
  group: supabase-delivery
  cancel-in-progress: false

jobs:
  validate:
    # Static checks only: no secrets, no prod writes. Safe on PRs and pushes.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile delivery scripts
        run: python3 -m py_compile scripts/supabase-migrate.py scripts/supabase-verify-schema.py

      - name: Check Supabase CLI config is checked in
        run: |
          test -f supabase/config.toml || (echo "Missing supabase/config.toml - CLI needs manual init otherwise" && exit 1)
          grep -q "project_id" supabase/config.toml

      - name: Lint migrations for idempotency
        # Every statement must be safe to re-apply (CI re-runs all files on
        # every push to main). Bare CREATE TABLE / INDEX / POLICY and bare
        # ADD COLUMN fail the run so they never reach the live database.
        run: |
          python3 - <<'EOF'
          import glob
          import re
          import sys

          bad: list[str] = []
          files = sorted(glob.glob("supabase/migrations/*.sql"))
          if not files:
              print("No migration files found")
              sys.exit(1)
          for path in files:
              sql = open(path, encoding="utf-8").read()
              if not sql.strip():
                  bad.append(f"{path}: empty file")
                  continue
              drops = len(re.findall(r"DROP\s+POLICY\s+IF\s+EXISTS", sql, re.I))
              creates = len(
                  re.findall(r"(?<!OR\sREPLACE\s)CREATE\s+POLICY\s+", sql, re.I)
              )
              if creates > drops:
                  bad.append(
                      f"{path}: {creates} CREATE POLICY but only "
                      f"{drops} DROP POLICY IF EXISTS"
                  )
              for i, line in enumerate(sql.splitlines(), 1):
                  s = line.strip().upper()
                  if re.match(r"CREATE\s+TABLE\s+(?!IF\s+NOT\s+EXISTS)", s):
                      bad.append(f"{path}:{i}: non-idempotent CREATE TABLE")
                  if re.match(
                      r"CREATE\s+(UNIQUE\s+)?INDEX\s+(?!IF\s+NOT\s+EXISTS)", s
                  ):
                      bad.append(f"{path}:{i}: non-idempotent CREATE INDEX")
                  if re.match(r"ADD\s+COLUMN\s+(?!IF\s+NOT\s+EXISTS)", s):
                      bad.append(f"{path}:{i}: non-idempotent ADD COLUMN")
          if bad:
              print("Migration idempotency lint FAILED:")
              print("\n".join(bad))
              sys.exit(1)
          print(f"Migration idempotency lint passed ({len(files)} files)")
          EOF

  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    # NEVER run on pull_request: PRs must not write to the production database.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_sha == github.sha)
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply database migrations (Management API)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: python3 scripts/supabase-migrate.py

      - name: Verify live schema matches expectations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: python3 scripts/supabase-verify-schema.py

  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate, migrate]
    # Deploy only after migrations land on the main branch, never from a PR.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_sha == github.sha)
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: v2.117.0

      - name: Deploy edge functions (if any)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ ! -d supabase/functions ] || [ -z "$(ls -A supabase/functions 2>/dev/null)" ]; then
            echo "No supabase/functions sources, skipping deploy."
            exit 0
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Missing Supabase credentials on a main-branch deploy, failing."
            exit 1
          fi
          # --project-ref keeps this non-interactive: no `supabase link`
          # (which would need a DB password / manual step) required.
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
