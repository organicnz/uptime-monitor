name: Supabase Migrations

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Allow manual dispatch to run migrations on demand
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply database migrations (Management API)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: python3 scripts/supabase-migrate.py

      - name: Verify live schema matches expectations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: python3 scripts/supabase-verify-schema.py

  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: migrate
    # Always runs; the deploy step skips gracefully when no edge function
    # sources exist, so introducing supabase/functions later needs no
    # workflow change.
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Deploy edge functions (if any)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ ! -d supabase/functions ] || [ -z "$(ls -A supabase/functions 2>/dev/null)" ]; then
            echo "No supabase/functions sources, skipping deploy."
            exit 0
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Missing Supabase credentials, skipping deploy."
            exit 0
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy
