name: Supabase Migrations

# Fully automated delivery: no manual SQL Editor pastes, no manual
# `supabase link` / `supabase db push` / dashboard deploys.
#
# - pull_request: validate only (lint + static checks). NEVER writes to prod.
# - push to main / workflow_dispatch: apply migrations, verify live schema,
#   then deploy edge functions.
#
# Required repository secrets: SUPABASE_ACCESS_TOKEN,
#   NOTIFICATION_DISPATCH_SECRET.
# Required repository variables: SUPABASE_PROJECT_REF.
#
#   SUPABASE_PROJECT_REF is the subdomain of https://<ref>.supabase.co and
#   is already public via NEXT_PUBLIC_SUPABASE_URL, so it is a variable, not a
#   secret. Only SUPABASE_ACCESS_TOKEN (a personal access token) is a secret.
#
# The delivery scripts are Bun/TypeScript (`scripts/supabase-migrate.ts`,
# `scripts/supabase-verify-schema.ts`, `scripts/lint-migrations.ts`); no
# Python or Node.js toolchain is provisioned here.

on:
  pull_request:
    branches: ["main"]
    paths:
      - "supabase/**"
      - "scripts/supabase-*.ts"
      - "scripts/lint-migrations.ts"
      - "scripts/migration-lint.ts"
      - ".github/workflows/supabase-migrations.yml"
  workflow_run:
    workflows: ["Quality Gate"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

# A migration must never be cancelled or run twice concurrently.
concurrency:
  group: supabase-delivery
  cancel-in-progress: false

jobs:
  validate:
    # Static checks only: no secrets, no prod writes. Safe on PRs and pushes.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # The latest Bun canary. The canary is a moving target: the npm
          # dist-tag is what tracks it, not a version string in
          # package.json, so `bun-version: canary` is the only thing that
          # stays correct as new canaries ship.
          bun-version: canary

      - name: Setup Deno
        if: hashFiles('supabase/functions/deno.json') != ''
        uses: denoland/setup-deno@v2
        with:
          deno-version: "v2.x"

      # The edge runtime has its own type environment, so `tsc` cannot see
      # Deno.serve / Deno.env / Deno.resolveDns. This also proves that
      # _shared/senders.ts really is runtime-agnostic: it must type-check
      # under Deno's lib and the app's DOM lib.
      - name: Type-check edge functions
        if: hashFiles('supabase/functions/deno.json') != ''
        working-directory: supabase/functions
        run: deno task check

      # Offline tests for the edge egress guard. The address classifier is
      # covered much more thoroughly (and against the Next.js runtime) by
      # `bun test`; these cover the transport's pre-network rejections.
      - name: Test edge functions
        if: hashFiles('supabase/functions/deno.json') != ''
        working-directory: supabase/functions
        run: deno task test

      - name: Compile delivery scripts
        run: >-
          bun build --target=bun --outdir=.bundle/scripts-check
          scripts/supabase-migrate.ts
          scripts/supabase-verify-schema.ts
          scripts/lint-migrations.ts

      - name: Check Supabase CLI config is checked in
        run: |
          test -f supabase/config.toml || (echo "Missing supabase/config.toml - CLI needs manual init otherwise" && exit 1)
          grep -q "project_id" supabase/config.toml

      - name: Lint migrations for idempotency
        # Every statement must be safe to re-apply (CI re-runs all files on
        # every push to main). Bare CREATE TABLE / INDEX / POLICY and bare
        # ADD COLUMN fail the run so they never reach the live database.
        run: bun run migrations:lint

  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    # Environment gate: add required reviewers / a wait timer under
    # Settings -> Environments -> production. The `if:` below is the
    # machine-checkable half; this is the human one.
    environment: production
    # NEVER run on pull_request: PRs must not write to the production database.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_sha == github.sha)
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # The latest Bun canary. The canary is a moving target: the npm
          # dist-tag is what tracks it, not a version string in
          # package.json, so `bun-version: canary` is the only thing that
          # stays correct as new canaries ship.
          bun-version: canary

      - name: Apply database migrations (Management API)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: bun run supabase:migrate

      - name: Verify live schema matches expectations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: bun run supabase:verify-schema

  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate, migrate]
    environment: production
    # Deploy only after migrations land on the main branch, never from a PR.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_sha == github.sha)
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: v2.117.0

      - name: Deploy edge functions (if any)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          NOTIFICATION_DISPATCH_SECRET: ${{ secrets.NOTIFICATION_DISPATCH_SECRET }}
        run: |
          if [ ! -d supabase/functions ] || [ -z "$(ls -A supabase/functions 2>/dev/null)" ]; then
            echo "No supabase/functions sources, skipping deploy."
            exit 0
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Missing Supabase credentials on a main-branch deploy, failing."
            exit 1
          fi
          # Provision the function's own secret store from a repository
          # secret before deploying, so the deployed function is never
          # missing it. `supabase secrets set` is idempotent.
          if [ -z "$NOTIFICATION_DISPATCH_SECRET" ]; then
            echo "NOTIFICATION_DISPATCH_SECRET is not set, failing."
            exit 1
          fi
          supabase secrets set \
            --project-ref "$SUPABASE_PROJECT_REF" \
            NOTIFICATION_DISPATCH_SECRET="$NOTIFICATION_DISPATCH_SECRET"

          # --project-ref keeps this non-interactive: no `supabase link`
          # (which would need a DB password / manual step) required.
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
