name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write # coverage artifact upload

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # The latest Bun canary. The canary is a moving target: the npm
          # dist-tag is what tracks it, not a version string in
          # package.json, so `bun-version: canary` is the only thing that
          # stays correct as new canaries ship.
          bun-version: canary

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build the Rust probe
        run: bun run build:probe

      - name: Verify the toolchain is Bun-only
        run: bun run doctor

      - name: Run tests with coverage gate (70% funcs / 80% lines)
        run: bun run coverage-check
        env:
          # Bun writes both reports from the same single test run.
          COVERAGE_JUNIT_PATH: .bundle/junit.xml
          COVERAGE_LCOV_DIR: .bundle/lcov

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summary
          path: .bundle/coverage-summary.json

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            .bundle/junit.xml
            .bundle/lcov/lcov.info
          if-no-files-found: ignore
