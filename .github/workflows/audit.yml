name: Audit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Weekly scan: catches newly disclosed CVEs even with no code changes.
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        shell: bash
        run: set -o pipefail; bun run audit 2>&1 | tee audit.log

      - name: Verify no vulnerabilities
        run: grep -q "No vulnerabilities found" audit.log
