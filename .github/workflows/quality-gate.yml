name: Quality Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # The latest Bun canary. The canary is a moving target: the npm
          # dist-tag is what tracks it, not a version string in
          # package.json, so `bun-version: canary` is the only thing that
          # stays correct as new canaries ship.
          bun-version: canary
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      # The type checker is tsrs, the Rust port of the TypeScript 7 compiler.
      # It is the only gate: it is 100% conformant with the reference
      # implementation, and it is the only TypeScript 7 checker that runs
      # without Node.js.
      - run: bun run typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # The latest Bun canary. The canary is a moving target: the npm
          # dist-tag is what tracks it, not a version string in
          # package.json, so `bun-version: canary` is the only thing that
          # stays correct as new canaries ship.
          bun-version: canary
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run lint
      - run: bun run format:check

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # The latest Bun canary. The canary is a moving target: the npm
          # dist-tag is what tracks it, not a version string in
          # package.json, so `bun-version: canary` is the only thing that
          # stays correct as new canaries ship.
          bun-version: canary
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      # The Rust probe: the container ships this binary, so CI builds it and
      # runs the suite against it. Without it the probe tests would skip and
      # the binary would never be exercised.
      - name: Build the Rust probe
        run: bun run build:probe
      - run: bun run doctor
      - run: bun run coverage-check
        env:
          # Bun writes both reports from the same single test run.
          COVERAGE_JUNIT_PATH: .bundle/junit.xml
          COVERAGE_LCOV_DIR: .bundle/lcov

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # The latest Bun canary. The canary is a moving target: the npm
          # dist-tag is what tracks it, not a version string in
          # package.json, so `bun-version: canary` is the only thing that
          # stays correct as new canaries ship.
          bun-version: canary
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - run: bun run bundle-size

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: v2.117.0
      - uses: oven-sh/setup-bun@v2
        with:
          # The latest Bun canary. The canary is a moving target: the npm
          # dist-tag is what tracks it, not a version string in
          # package.json, so `bun-version: canary` is the only thing that
          # stays correct as new canaries ship.
          bun-version: canary
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run e2e:install:ci
      - name: Start local Supabase
        run: supabase start --exclude studio,imgproxy,vector,analytics,inbucket
      - name: Reset local database
        run: supabase db reset --local --no-seed
      - name: Export local Supabase connection
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - name: Seed E2E fixture
        run: bun run e2e:seed
        env:
          E2E_EMAIL: e2e@uptime-monitor.test
          E2E_PASSWORD: E2ePassword123
          E2E_PUBLIC_STATUS_SLUG: e2e-status
      - run: bun run build
      - run: bun run e2e:ci
        env:
          E2E_EMAIL: e2e@uptime-monitor.test
          E2E_PASSWORD: E2ePassword123
          E2E_PUBLIC_STATUS_SLUG: e2e-status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7
