name: Retention cleanup

on:
  # 03:17 UTC, daily: off-peak for the runner fleet and outside the :00 stampede.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check configuration
        shell: bash
        run: |
          missing=0
          if [ -z "${{ vars.SITE_URL }}" ]; then
            echo "::error::Repository variable SITE_URL is not set. It must hold the app's public URL."
            missing=1
          fi
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::Repository secret CRON_SECRET is not set. It must match the app's CRON_SECRET."
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then exit 1; fi

      - name: Run retention cleanup
        shell: bash
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/cleanup"
