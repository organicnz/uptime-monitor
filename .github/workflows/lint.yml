name: Lint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # The latest Bun canary. The canary is a moving target: the npm
          # dist-tag is what tracks it, not a version string in
          # package.json, so `bun-version: canary` is the only thing that
          # stays correct as new canaries ship.
          bun-version: canary

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run the linter (Bun's own)
        run: bun run lint

      - name: Verify no lint problems
        run: 'bun run lint && echo "bun lint: 0 problems"'

      - name: Verify formatting (Bun's own formatter)
        run: bun run format:check
