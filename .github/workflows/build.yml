name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production build
        run: bun run build
        env:
          # Source-map upload happens inside `next build` via withSentryConfig.
          # Missing values skip upload gracefully (local/dev builds).
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

      - name: Verify build succeeded
        run: |
          if [ ! -d ".next" ]; then
            echo "Build failed - .next directory not created"
            exit 1
          fi
          echo "Build passed successfully"

      - name: Bundle size guard (Bun-native, 10% limit)
        run: bun run bundle-size

      - name: Upload bundle size artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-size
          path: .bundle/size.json
