name: Build

# The source-map upload needs three things, and only one of them is a
# secret:
#
#   SENTRY_AUTH_TOKEN   a secret: the Sentry auth token
#   SENTRY_ORG          a variable: the organisation id
#   SENTRY_PROJECT      a variable: the project id
#
# The variables are the public half of a Sentry project, so they are
# variables rather than secrets, and the upload is skipped when they are
# missing — the build still succeeds, and the stack traces in Sentry are
# simply not mapped to the source.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write # bundle-size artifact upload

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # The latest Bun canary. The canary is a moving target: the npm
          # dist-tag is what tracks it, not a version string in
          # package.json, so `bun-version: canary` is the only thing that
          # stays correct as new canaries ship.
          bun-version: canary

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Production build
        run: bun run build
        env:
          # Source-map upload happens inside `next build` via withSentryConfig.
          # Missing values skip upload gracefully (local/dev builds).
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

      - name: Verify build succeeded
        run: |
          if [ ! -d ".next" ]; then
            echo "Build failed - .next directory not created"
            exit 1
          fi
          echo "Build passed successfully"

      - name: Bundle size guard (Bun-native, 10% limit)
        run: bun run bundle-size

      - name: Upload bundle size artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-size
          path: .bundle/size.json
